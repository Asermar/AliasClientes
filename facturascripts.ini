name = 'AliasClientes'
description = 'Alias de clientes y proveedores: integra el plugin Alias en sus fichas.'
version = 1.03
; min_version: el core marca incompatible todo min_version < 2025; además require Alias (v2025).
min_version = 2025
; min_php: PHP mínimo del core v2025 (8)
min_php = 8
require = 'Alias'
; require_min: Alias 1.03 trae Lib/AliasTabGuard, que usan las extensiones de las dos fichas.
; Convención de la casa: el núcleo NO lee require_min, así que esto documenta, no impide instalar.
require_min = 'Alias:1.03'
